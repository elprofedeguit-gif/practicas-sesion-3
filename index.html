<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Zona de Práctica – Sesión 3 ⭐</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --bg:#141414;
  --green:#22C55E;          /* ✅ NUEVO VERDE */
  --green-light:#6aff9c;
  --violet:#C9A9FF;
  --yellow:#E0BA30;
  --orange:orange;
}

body{
  margin:0;
  background:var(--bg);
  color:#fff;
  font-family:Arial,sans-serif;
}

.page{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding-top:40px;
  box-sizing:border-box;
}

.header{
  display:flex;
  flex-direction:column;
  align-items:center;
}
.header img{
  width:150px;
  max-width:80%;
  margin-bottom:12px;
}

h1{
  color:var(--green);       /* ✅ NUEVO VERDE */
  margin:0;
  font-weight:600;
  text-align:center;
}

.subtitle{
  color:var(--violet);
  font-style:italic;
  font-size:clamp(14px,4vw,16px);
  margin:6px 0 24px;
}

.container{
  max-width:720px;
  width:100%;
  padding:16px;
  text-align:center;
  box-sizing:border-box;
}

.menu-btn{
  width:100%;
  max-width:420px;
  background:#1e1e1e;
  border:1.5px solid var(--green);  /* ✅ */
  border-radius:12px;
  padding:16px;
  margin:12px auto;
  cursor:pointer;
  color:#fff;
  font-size:16px;
  font-weight:600;
}
.menu-btn:active{ transform:scale(.97); }

.section{ display:none; }

.circle{
  width:150px;
  height:150px;
  border-radius:50%;
  background:#222;
  margin:32px auto 24px;
}
.circle.on{ background:var(--green); } /* ✅ */

.controls{ margin:16px auto; max-width:300px; }
input[type=range]{ width:100%; }

button.control{
  background:var(--green);  /* ✅ */
  color:#000;
  border:none;
  border-radius:12px;
  padding:12px 26px;
  margin:10px;
  cursor:pointer;
  font-size:15px;
  font-weight:600;
}
button.control:active{ transform:scale(.96); }
button.control.playing{ background:var(--green-light); }

.progression{
  display:flex;
  justify-content:space-between;
  margin:20px 0 24px;
}

.chord{
  flex:1;
  margin:0 4px;
  padding:12px 6px;
  border-radius:10px;
  background:#222;
  cursor:pointer;
  font-size:14px;
}
.chord.selected{ outline:2px solid var(--violet); }
.chord.active{
  background:var(--green);  /* ✅ */
  color:#000;
}

.count{
  display:flex;
  justify-content:center;
  font-size:42px;
  margin-bottom:20px;
}
.count span{ width:36px; opacity:.3; }
.count .one{ color:var(--yellow); opacity:1; }
.count .other{ color:var(--orange); opacity:1; }

@media(max-width:600px){
  .count{ font-size:34px; }
}
</style>
</head>

<body>
<div class="page">

<div class="header">
  <img src="https://static.wixstatic.com/media/b4a607_0927246f3864402c8d6d2d56723b8bba~mv2.png">
  <h1>Zona de Práctica – Sesión 3 ⭐</h1>
  <div class="subtitle">Cuando la música comienza</div>
</div>

<div class="container section" id="menu" style="display:block">
  <button class="menu-btn" onclick="show('dig1')">▶ Digitación – Ejercicio 1</button>
  <button class="menu-btn" onclick="show('dig2')">▶ Digitación – Ejercicio 2</button>
  <button class="menu-btn" onclick="show('letitbe')">▶ Let It Be – Práctica de acordes</button>
</div>

<!-- resto del HTML y JS SIN CAMBIOS -->

</div>
</body>
</html>
